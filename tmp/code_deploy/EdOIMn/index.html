<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>计时器</title>\n  <script src=\"https://cdn.tailwindcss.com\"></script>\n</head>\n<body class=\"bg-gray-100\">\n  <div class=\"container mx-auto p-4\">\n    <h1 class=\"text-2xl font-bold text-center\">计时器</h1>\n    <div id=\"time-display\" class=\"text-5xl font-bold text-center\">00:00:00</div>\n    <div class=\"flex justify-center space-x-4 mt-4\">\n      <button id=\"start-btn\" class=\"px-4 py-2 bg-blue-500 text-white rounded\">开始</button>\n      <button id=\"pause-btn\" class=\"px-4 py-2 bg-gray-500 text-white rounded\">暂停</button>\n      <button id=\"reset-btn\" class=\"px-4 py-2 bg-red-500 text-white rounded\">重启</button>\n    </div>\n  </div>\n  <script>\n    let time = 0;\n    let intervalId = null;\n\n    function updateDisplay() {\n      const seconds = Math.floor(time / 1000);\n      const minutes = Math.floor((time % 60000) / 1000);\n      const hours = Math.floor(time / 3600000);\n      time += 1000;\n      const display = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;\n      document.getElementById('time-display').textContent = display;\n    }\n\n    function startTimer() {\n      if (intervalId === null) {\n        intervalId = setInterval(updateDisplay, 1000);\n      }\n    }\n\n    function pauseTimer() {\n      clearInterval(intervalId);\n      intervalId = null;\n    }\n\n    function resetTimer() {\n      time = 0;\n      document.getElementById('time-display').textContent = '00:00:00';\n      intervalId = null;\n    }\n\n    document.addEventListener('DOMContentLoaded', () => {\n      document.getElementById('start-btn').addEventListener('click', startTimer);\n      document.getElementById('pause-btn').addEventListener('click', pauseTimer);\n      document.getElementById('reset-btn').addEventListener('click', resetTimer);\n    });\n  </script>\n</body>\n</html>

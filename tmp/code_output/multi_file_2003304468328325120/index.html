<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务清单网站</title>
  <link href="https://cdn.tailwindcss.com" rel="stylesheet">
</head>
<body class="bg-gray-50">
  <div class="container mx-auto p-4 max-w-md md:max-w-lg">
    <h1 class="text-2xl font-bold text-center mb-4">任务清单</h1>
    <div class="flex flex-col md:flex-row gap-4">
      <input type="text" id="taskInput" class="border p-2 rounded w-full md:w-1/2" placeholder="输入新任务...">
      <button id="addTaskBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">添加任务</button>
    </div>
    <ul id="taskList" class="mt-4 list-disc list-inside space-y-2">
      <!-- Tasks will be added here dynamically -->
    </ul>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const taskInput = document.getElementById('taskInput');
      const addTaskBtn = document.getElementById('addTaskBtn');
      const taskList = document.getElementById('taskList');

      addTaskBtn.addEventListener('click', () => {
        const taskText = taskInput.value.trim();
        if (taskText) {
          const li = document.createElement('li');
          li.className = 'flex items-center';
          li.innerHTML = `<input type="checkbox" class="form-checkbox h-4 w-4 text-blue-500"> <span class="ml-2">${taskText}</span>`;
          taskList.appendChild(li);
          taskInput.value = '';
        }
      });
    });
  </script>
</body>
</html>

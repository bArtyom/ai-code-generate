<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>任务记录网站</title>\n  <script src=\"https://cdn.tailwindcss.com\"></script>\n  <style>\n<!-- 任务记录网站 - 响应式布局 -->\n  </style>\n</head>\n<body class=\"bg-gray-100\">\n  <header class=\"bg-blue-600 text-white p-4\">\n    <h1 class=\"text-2xl font-bold\">任务记录网站</h1>\n  </header>\n  <main class=\"container mx-auto p-4\">\n    <div class=\"flex flex-col md:flex-row gap-4\">\n      <div class=\"flex-1\">\n        <input type=\"text\" id=\"taskInput\" placeholder=\"输入新任务\" class=\"border rounded p-2 w-full\">\n        <button id=\"addTaskBtn\" class=\"bg-green-500 text-white px-4 py-2 rounded mt-2\">添加任务</button>\n      </div>\n      <div class=\"flex-1\">\n        <h2 class=\"text-xl font-semibold mb-2\">任务列表</h2>\n        <ul id=\"taskList\" class=\"list-disc pl-5 space-y-2\">\n          <!-- 任务列表将动态生成 -->\n        </ul>\n      </div>\n    </div>\n  </main>\n  <footer class=\"bg-gray-200 text-center py-2\">\n    <p>任务记录网站 - 2023</p>\n  </footer>\n  <script>\n    <!-- 任务记录网站 - JS逻辑 -->\n    <!-- 任务记录网站 - 用localStorage存储任务 -->\n    let tasks = [];\n\n    document.addEventListener('DOMContentLoaded', function() {\n      <!-- 初始化任务列表 -->\n      loadTasks();\n      <!-- 添加任务按钮点击事件 -->\n      document.getElementById('addTaskBtn').addEventListener('click', function() {\n        const taskInput = document.getElementById('taskInput');\n        const taskText = taskInput.value.trim();\n        if (taskText) {\n          <!-- 添加任务到localStorage -->\n          tasks.push(taskText);\n          saveTasks();\n          <!-- 重置输入框 -->\n          taskInput.value = '';\n          <!-- 更新任务列表 -->\n          renderTasks();\n        }\n      });\n      <!-- 删除任务功能 -->\n      document.getElementById('taskList').addEventListener('click', function(event) {\n        if (event.target.classList.contains('delete-btn')) {\n          const taskId = event.target.getAttribute('data-id');\n          <!-- 从localStorage移除任务 -->\n          tasks = tasks.filter(task => task !== taskId);\n          saveTasks();\n          <!-- 更新任务列表 -->\n          renderTasks();\n        }\n      });\n    });\n\n    function saveTasks() {\n      <!-- 保存任务到localStorage -->\n      localStorage.setItem('tasks', JSON.stringify(tasks));\n    }\n\n    function loadTasks() {\n      <!-- 从localStorage加载任务 -->\n      const savedTasks = localStorage.getItem('tasks');\n      if (savedTasks) {\n        tasks = JSON.parse(savedTasks);\n      }\n    }\n\n    function renderTasks() {\n      <!-- 渲染任务列表 -->\n      const taskList = document.getElementById('taskList');\n      taskList.innerHTML = '';\n      tasks.forEach(task => {\n        const li = document.createElement('li');\n        li.className = 'flex items-center';\n        li.innerHTML = `<span class=\"text-gray-700\">${task}</span> <button class=\"delete-btn ml-2 bg-red-500 text-white px-2 py-1 rounded\" data-id=\"${task}\">删除</button>`;\n        taskList.appendChild(li);\n      });\n    }\n  </script>\n</body>\n</html>

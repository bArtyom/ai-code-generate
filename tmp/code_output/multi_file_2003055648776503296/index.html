<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>任务记录网站</title>\n  <link href=\"https://cdn.tailwindcss.com\" rel=\"stylesheet\">\n</head>\n<body class=\"bg-gray-50\">\n  <header class=\"bg-blue-600 text-white p-4\">\n    <h1 class=\"text-2xl font-bold\">任务记录网站</h1>\n  </header>\n  <main class=\"container mx-auto p-4 max-w-2xl\">\n    <div class=\"mb-4\">\n      <input type=\"text\" id=\"taskInput\" placeholder=\"输入新任务...\" class=\"border border-gray-300 rounded p-2 w-full\">\n      <button id=\"addTaskBtn\" class=\"mt-2 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600\">添加任务</button>\n    </div>\n    <ul id=\"taskList\" class=\"list-none\">\n    </ul>\n  </main>\n  <script>\n    document.addEventListener('DOMContentLoaded', function() {\n      const taskInput = document.getElementById('taskInput');\n      const addTaskBtn = document.getElementById('addTaskBtn');\n      const taskList = document.getElementById('taskList');\n      const tasks = JSON.parse(localStorage.getItem('tasks')) || [];\n\n      // 渲染任务列表\n      function renderTaskList() {\n        taskList.innerHTML = '';\n        tasks.forEach(task => {\n          const li = document.createElement('li');\n          li.className = 'flex items-center justify-between p-2 bg-white rounded shadow mb-1 border-l-4 border-blue-200';\n          li.innerHTML = `\n            <input type=\"checkbox\" id=\"task-${task.id}\" class=\"mr-2\" ${task.completed ? 'checked' : ''}>\n            <label for=\"task-${task.id}\" class=\"text-gray-700\">${task.text}</label>\n            <button class=\"text-red-500 hover:text-red-700 text-sm ml-2\">删除</button>\n          `;\n          taskList.appendChild(li);\n        });\n      }\n\n      // 添加新任务\n      addTaskBtn.addEventListener('click', function() {\n        const taskText = taskInput.value.trim();\n        if (taskText) {\n          const newTask = {\n            id: Date.now(),\n            text: taskText,\n            completed: false\n          };\n          tasks.push(newTask);\n          localStorage.setItem('tasks', JSON.stringify(tasks));\n          taskInput.value = '';\n          renderTaskList();\n        }\n      });\n\n      // 事件监听器\n      taskList.addEventListener('click', function(event) {\n        if (event.target.classList.contains('text-red-500')) {\n          const li = event.target.parentElement;\n          const taskIndex = Array.from(taskList.children).indexOf(li);\n          tasks.splice(taskIndex, 1);\n          localStorage.setItem('tasks', JSON.stringify(tasks));\n          renderTaskList();\n        }\n      });\n\n      // 初始渲染\n      renderTaskList();\n    });\n  </script>\n</body>\n</html>

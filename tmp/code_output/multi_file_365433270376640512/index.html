<!DOCTYPE html>\n<html lang=\"zh\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>电商页面</title>\n    <link href=\"https://cdn.tailwindcss.com\" rel=\"stylesheet\">\n</head>\n<body class=\"bg-gray-100\">\n    <div class=\"container mx-auto px-4 py-8\">\n        <h1 class=\"text-3xl font-bold text-center mb-6\">电商产品</h1>\n        <div class=\"grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4\">\n            <div class=\"bg-white p-4 rounded shadow-md border border-gray-200\">\n                <h2 class=\"text-xl font-semibold\">产品 1</h2>\n                <p class=\"text-gray-600\">价格: ¥19.99</p>\n                <button class=\"add-to-cart bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600\" data-product-id=\"1\">加入购物车</button>\n            </div>\n            <div class=\"bg-white p-4 rounded shadow-md border border-gray-200\">\n                <h2 class=\"text-xl font-semibold\">产品 2</h2>\n                <p class=\"text-gray-600\">价格: ¥29.99</p>\n                <button class=\"add-to-cart bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600\" data-product-id=\"2\">加入购物车</button>\n            </div>\n            <div class=\"bg-white p-4 rounded shadow-md border border-gray-200\">\n                <h2 class=\"text-xl font-semibold\">产品 3</h2>\n                <p class=\"text-gray-600\">价格: ¥39.99</p>\n                <button class=\"add-to-cart bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600\" data-product-id=\"3\">加入购物车</button>\n            </div>\n        </div>\n        <div class=\"mt-8 text-center\">\n            <h2 class=\"text-2xl font-bold\">购物车</h2>\n            <span class=\"cart-count text-lg font-bold\">0</span>\n        </div>\n    </div>\n    <script>\n        document.addEventListener('DOMContentLoaded',()=>{const addToCartButtons=document.querySelectorAll('.add-to-cart');addToCartButtons.forEach(button=>{button.addEventListener('click',()=>{const productId=button.getAttribute('data-product-id');const product={id:productId,name:'产品 '+productId,price:19.99+(productId-1)*10};const cartCountElement=document.querySelector('.cart-count');if(cartCountElement){cartCountElement.textContent=parseInt(cartCountElement.textContent)+1;}}});})\n    </script>\n</body>\n</html>

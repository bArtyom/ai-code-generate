<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>任务记录网站</title>\n  <link href=\"https://cdn.tailwindcss.com\" rel=\"stylesheet\">\n</head>\n<body>\n  <h1 class=\"text-2xl font-bold text-center mb-4\">任务记录网站</h1>\n  <div class=\"max-w-screen-lg mx-auto\">\n    <div class=\"flex flex-col md:flex-row gap-4\">\n      <input id=\"taskInput\" type=\"text\" placeholder=\"输入任务描述\" class=\"border rounded p-2 w-full md:w-1/2\">\n      <button id=\"addTaskBtn\" class=\"bg-blue-500 text-white px-4 py-2 rounded\">添加任务</button>\n    </div>\n    <ul id=\"taskList\" class=\"mt-4 list-none\">\n    </ul>\n  </div>\n  <script>\n    // 任务记录网站的 JavaScript 代码\n    // 1. 初始化任务列表\n    // 2. 渲染任务\n    // 3. 添加任务事件\n    // 4. 删除任务事件\n\n    // 从 localStorage 获取任务\n
// let tasks = JSON.parse(localStorage.getItem('tasks')) || [];\n\n    // 渲染任务列表\n    function renderTasks() {\n      const taskList = document.getElementById('taskList');\n      taskList.innerHTML = '';\n      tasks.forEach(task => {\n        const li = document.createElement('li');\n        li.className = 'p-2 border rounded mb-1 flex justify-between';\n        li.innerHTML = `<span>${task}</span> <button class=\"delete-btn bg-red-500 text-white px-2 py-1 rounded\">删除</button>`;\n        taskList.appendChild(li);\n      });\n    }\n\n    // 添加任务\n    document.getElementById('addTaskBtn').addEventListener('click', function() {\n      const input = document.getElementById('taskInput');\n      const task = input.value.trim();\n      if (task) {\n        tasks.push(task);\n        localStorage.setItem('tasks', JSON.stringify(tasks));\n        input.value = '';\n        renderTasks();\n      }\n    });\n\n    // 删除任务\n    document.addEventListener('click', function(event) {\n      if (event.target.classList.contains('delete-btn')) {\n        const taskList = document.getElementById('taskList');\n        const li = event.target.closest('li');\n        const task = li.querySelector('span').textContent;\n        tasks = tasks.filter(t => t !== task);\n        localStorage.setItem('tasks', JSON.stringify(tasks));\n        taskList.removeChild(li);\n      }\n    });\n\n    // 初始化\n    renderTasks();\n  </script>\n</body>\n</html>

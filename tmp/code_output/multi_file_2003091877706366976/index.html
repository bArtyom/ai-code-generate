<!DOCTYPE html><html lang=\"zh-CN\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>任务记录网站</title><script src=\"https://cdn.tailwindcss.com\"></script></head><body class=\"bg-gray-50\"><header class=\"bg-blue-600 text-white p-4\"><h1 class=\"text-2xl font-bold\">任务记录</h1></header><main class=\"container mx-auto p-4\"><div class=\"mb-4\"><input type=\"text\" id=\"taskInput\" placeholder=\"输入新任务\" class=\"border rounded p-2 w-full\"><button id=\"addTaskBtn\" class=\"mt-2 bg-green-500 text-white px-4 py-2 rounded\">添加任务</button></div><ul id=\"taskList\" class=\"list-disc pl-5 space-y-2\"></ul></main><footer class=\"bg-gray-200 text-center py-2\"><p>任务记录网站 | 2023</p></footer><script>const taskInput=document.getElementById('taskInput');const addTaskBtn=document.getElementById('addTaskBtn');const taskList=document.getElementById('taskList');addTaskBtn.addEventListener('click',()=>{const taskText=taskInput.value.trim();if(taskText){const li=document.createElement('li');li.className='flex items-center';const span=document.createElement('span');span.className='text-gray-700';span.textContent=taskText;li.appendChild(span);taskList.appendChild(li);taskInput.value='';}});</script></body></html>

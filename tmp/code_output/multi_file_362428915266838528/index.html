<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>任务记录工具</title>\n  <script src=\"https://cdn.tailwindcss.com\"></script>\n</head>\n<body class=\"bg-gray-100 p-4\">\n  <h1 class=\"text-2xl font-bold text-center mb-4\">任务记录工具</h1>\n  <div class=\"max-w-md mx-auto\">\n    <input type=\"text\" id=\"taskInput\" class=\"block w-full p-2 mb-2 border border-gray-300 rounded\" placeholder=\"输入新任务...\">\n    <button id=\"addButton\" class=\"bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600\">添加任务</button>\n  </div>\n  <ul id=\"taskList\" class=\"list-none p-0\"></ul>\n  <script>\n    document.addEventListener('DOMContentLoaded', function() {\n      const taskInput = document.getElementById('taskInput');\n      const addButton = document.getElementById('addButton');\n      const taskList = document.getElementById('taskList');\n\n      addButton.addEventListener('click', function() {\n        const task = taskInput.value.trim();\n        if (task) {\n          const li = document.createElement('li');\n          li.className = 'task-item';\n          li.innerHTML = `<span>${task}</span> <button onclick=\"removeTask(this)\">删除</button>`;\n          taskList.appendChild(li);\n          taskInput.value = '';\n        }\n      });\n    });\n\n    function removeTask(button) {\n      const li = button.parentElement;\n      li.remove();\n    }\n  </script>\n</body>\n</html>

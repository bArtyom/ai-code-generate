<!DOCTYPE html>\n<html lang=\"zh\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>任务记录网站</title>\n  <script src=\"https://cdn.tailwindcss.com\"></script>\n</head>\n<body class=\"bg-gray-100\">\n  <header class=\"bg-blue-600 text-white p-4\">\n    <h1 class=\"text-2xl font-bold\">任务记录</h1>\n  </header>\n  <main class=\"container mx-auto p-4\">\n    <div class=\"mb-4\">\n      <input type=\"text\" id=\"taskTitle\" placeholder=\"输入任务标题\" class=\"border rounded p-2 w-full\">\n      <textarea id=\"taskDesc\" placeholder=\"输入任务描述\" class=\"border rounded p-2 w-full mt-2\"></textarea>\n      <button id=\"addTask\" class=\"bg-green-500 text-white px-4 py-2 rounded mt-2\">添加任务</button>\n    </div>\n    <ul id=\"taskList\" class=\"list-disc pl-5 space-y-2\">\n    </ul>\n  </main>\n  <footer class=\"bg-gray-200 text-center p-4\">\n    <p>任务记录网站</p>\n  </footer>\n  <script>\n    document.addEventListener('DOMContentLoaded', () => {\n      const addTaskBtn = document.getElementById('addTask');\n      const taskTitle = document.getElementById('taskTitle');\n      const taskDesc = document.getElementById('taskDesc');\n      const taskList = document.getElementById('taskList');\n\n      addTaskBtn.addEventListener('click', () => {\n        const title = taskTitle.value.trim();\n        const desc = taskDesc.value.trim();\n        if (title) {\n          const taskItem = document.createElement('li');\n          taskItem.className = 'flex items-start';\n          taskItem.innerHTML = `\n            <input type=\"checkbox\" class=\"mr-2\">\n            <div class=\"flex-1\">\n              <h3 class=\"font-bold\">${title}</h3>\n              <p class=\"text-gray-600\">${desc}</p>\n            </div>\n          `;\n          taskList.appendChild(taskItem);\n          taskTitle.value = '';\n          taskDesc.value = '';\n        }\n      });\n    });\n  </script>\n</body>\n</html>

<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>任务记录网站</title>\n    <script src=\"https://cdn.tailwindcss.com\"></script>\n</head>\n<body>\n    <header class=\"bg-gray-800 text-white p-4\">\n        <h1 class=\"text-2xl font-bold\">任务记录</h1>\n    </header>\n    <main class=\"container mx-auto p-4\">\n        <div class=\"flex flex-col md:flex-row gap-4\">\n            <div class=\"flex-1\">\n                <input type=\"text\" id=\"taskInput\" placeholder=\"输入新任务...\" class=\"w-full p-2 border rounded\">\n                <button id=\"addButton\" class=\"mt-2 bg-blue-500 text-white px-4 py-2 rounded\">添加任务</button>\n            </div>\n            <div class=\"flex-1\">\n                <h2 class=\"text-xl font-semibold mb-2\">任务列表</h2>\n                <ul id=\"taskList\" class=\"list-disc pl-5 space-y-2\">\n                </ul>\n            </div>\n        </div>\n    </main>\n    <footer class=\"bg-gray-200 text-center py-4\">\n        <p>任务记录网站 | 2023</p>\n    </footer>\n    <script>\n        let tasks = [];\n\n        document.getElementById('addButton').addEventListener('click', () => {\n            const taskInput = document.getElementById('taskInput');\n            const taskText = taskInput.value.trim();\n            if (taskText) {\n                tasks.push(taskText);\n                taskInput.value = '';\n                renderTasks();\n            }\n        });\n\n        function renderTasks() {\n            const taskList = document.getElementById('taskList');\n            taskList.innerHTML = '';\n            tasks.forEach(task => {\n                const li = document.createElement('li');\n                li.className = 'flex items-center justify-between p-2 bg-gray-100 rounded';\n                li.innerHTML = `<span class=\"text-gray-700\">${task}</span><button class=\"text-red-500 hover:text-red-700\" onclick=\"removeTask(this)\">删除</button>`;\n                taskList.appendChild(li);\n            });\n        }\n\n        function removeTask(button) {\n            const li = button.parentElement;\n            const taskText = li.querySelector('span').textContent;\n            const index = tasks.indexOf(taskText);\n            if (index !== -1) {\n                tasks.splice(index, 1);\n                renderTasks();\n            }\n        }\n\n        renderTasks();\n    </script>\n</body>\n</html>

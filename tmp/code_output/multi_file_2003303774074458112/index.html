<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>任务清单网站</title><script src="https://cdn.tailwindcss.com"></script></head><body><div class="container mx-auto p-4"><h1 class="text-2xl font-bold mb-4">我的任务清单</h1><div class="flex flex-col md:flex-row gap-4"><input type="text" id="taskInput" class="border p-2 w-full md:w-1/2" placeholder="输入新任务..."><button id="addTask" class="bg-blue-500 text-white px-4 py-2 rounded">添加任务</button></div><ul id="taskList" class="mt-4 list-none"></ul></div><script>document.addEventListener('DOMContentLoaded', () => {const taskInput = document.getElementById('taskInput');const addTaskBtn = document.getElementById('addTask');const taskList = document.getElementById('taskList');addTaskBtn.addEventListener('click', () => {const task = taskInput.value.trim();if (task) {const li = document.createElement('li');li.className = 'p-2 border rounded mb-2 bg-gray-100';li.innerHTML = `<span class="text-lg">${task}</span> <button class="ml-2 bg-red-500 text-white px-2 py-1 rounded delete-btn">删除</button>`;taskList.appendChild(li);taskInput.value = '';} });taskList.addEventListener('click', (e) => {if (e.target.classList.contains('delete-btn')) {e.target.parentElement.remove();}});});</script></body></html>

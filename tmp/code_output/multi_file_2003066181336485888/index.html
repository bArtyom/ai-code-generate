<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务记录网站</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">任务记录</h1>
        <div class="mb-4 flex items-center">
            <input type="text" id="taskInput" class="border p-2 w-full" placeholder="输入新任务...">
            <button id="addTaskBtn" class="bg-blue-500 text-white px-4 py-2 rounded ml-2">添加任务</button>
        </div>
        <ul id="taskList" class="space-y-2">
        </ul>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addTaskBtn = document.getElementById('addTaskBtn');
            const taskInput = document.getElementById('taskInput');
            const taskList = document.getElementById('taskList');

            addTaskBtn.addEventListener('click', () => {
                const task = taskInput.value.trim();
                if (task) {
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center p-2 bg-gray-100 rounded';
                    li.innerHTML = `\n                        <span class="text-gray-700">${task}</span>\n                        <button class="text-red-500 hover:text-red-700">删除</button>\n                    `;
                    taskList.appendChild(li);
                    taskInput.value = '';
                }
            });

            taskList.addEventListener('click', (e) => {
                if (e.target.classList.contains('text-red-500')) {
                    e.target.parentElement.remove();
                }
            });
        });
    </script>
</body>
</html>
